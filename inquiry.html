<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>견적 문의 | 꽃피는 커튼 블라인드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.done{background:var(--paper);border:1px solid var(--sand);border-radius:18px;padding:44px 20px;text-align:center}
.done .mark{width:60px;height:60px;border-radius:50%;background:var(--linen);color:var(--walnut);display:grid;place-items:center;margin:0 auto 14px;font-size:28px}
.done h2{font-size:24px}
.done p{color:var(--umber);margin-top:8px}
</style>
</head>
<body>
<div id="site-header"></div>

<div class="phero">
  <div class="wrap">
    <span class="eyebrow">Free estimate</span>
    <h1>무료 견적 문의</h1>
    <p>아래 정보를 남겨주시면 확인 후 빠르게 연락드리겠습니다.</p>
  </div>
</div>

<section>
  <div class="wrap narrow">
    <form class="form" id="form" novalidate>
      <div class="f"><label for="name">성함 <span class="req">*</span></label><input type="text" id="name" autocomplete="name"><div class="err" id="e-name" hidden>성함을 입력해주세요.</div></div>
      <div class="f"><label for="phone">연락처 <span class="req">*</span></label><input type="tel" id="phone" class="tnum" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13"><div class="err" id="e-phone" hidden>연락처를 정확히 입력해주세요.</div></div>
      <div class="f"><label for="email">이메일 (선택)</label><input type="email" id="email" autocomplete="email"><div class="err" id="e-email" hidden>이메일 형식을 확인해주세요.</div></div>
      <div class="f"><label for="region">거주 지역 <span class="req">*</span></label>
        <select id="region">
          <option value="">선택해주세요</option>
          <optgroup label="서울"><option>서울 강남구</option><option>서울 서초구</option><option>서울 송파구</option><option>서울 강동구</option><option>서울 구로구</option><option>서울 금천구</option><option>서울 기타 지역</option></optgroup>
          <optgroup label="경기"><option>경기 광명</option><option>경기 부천</option><option>경기 안양</option><option>경기 시흥</option><option>경기 기타</option></optgroup>
          <optgroup label="인천"><option>인천 부평구</option><option>인천 계양구</option><option>인천 남동구</option><option>인천 서구</option><option>인천 기타</option></optgroup>
          <option>기타 지역</option>
        </select><div class="err" id="e-region" hidden>거주 지역을 선택해주세요.</div></div>
      <div class="f"><label for="space">공간 종류 <span class="req">*</span></label>
        <select id="space"><option value="">선택해주세요</option><option>거실</option><option>침실</option><option>주방</option><option>사무실</option><option>매장</option><option>기타</option></select>
        <div class="err" id="e-space" hidden>공간 종류를 선택해주세요.</div></div>
      <div class="f"><label for="windows">창문 개수 (선택)</label><input type="number" id="windows" inputmode="numeric" min="1"></div>
      <div class="f" role="group" aria-labelledby="l-prod"><span class="lbl" id="l-prod">희망 커튼·블라인드 종류 (중복 선택 가능)</span>
        <div class="checks">
          <label class="ck"><input type="checkbox" id="p1" value="린넨 커튼">린넨 커튼</label>
          <label class="ck"><input type="checkbox" id="p2" value="암막 커튼">암막 커튼</label>
          <label class="ck"><input type="checkbox" id="p3" value="우드 블라인드">우드 블라인드</label>
          <label class="ck"><input type="checkbox" id="p4" value="롤스크린">롤스크린</label>
          <label class="ck"><input type="checkbox" id="p5" value="콤비 블라인드">콤비 블라인드</label>
          <label class="ck"><input type="checkbox" id="p6" value="허니콤">허니콤</label>
          <label class="ck"><input type="checkbox" id="p7" value="잘 모르겠어요">잘 모르겠어요</label>
        </div></div>
      <div class="f"><label for="date">방문 희망일 (선택)</label><input type="date" id="date"></div>
      <div class="f"><label for="memo">추가 문의사항</label><textarea id="memo"></textarea></div>
      <div class="f"><label class="agree" for="agree"><input type="checkbox" id="agree"><span>개인정보 수집·이용에 동의합니다 (견적 안내 목적으로만 사용)</span></label><div class="err" id="e-agree" hidden>개인정보 수집·이용에 동의해주세요.</div></div>
      <button type="submit" class="btn pri" style="border-radius:12px;min-height:56px;font-size:17px">무료 견적 신청하기</button>
    </form>

    <div class="done" id="done" hidden>
      <div class="mark">✓</div>
      <h2>견적 신청이 접수되었습니다</h2>
      <p>확인 후 남겨주신 연락처로 연락드리겠습니다.<br>급하시면 <b class="tnum">070-8098-8555</b>로 전화 주세요.</p>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="site.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const t=new Date();t.setDate(t.getDate()+1);$("#date").min=t.toISOString().slice(0,10);
function fmt(v){const d=v.replace(/\D/g,"").slice(0,11);
  if(d.startsWith("02")){if(d.length<3)return d;if(d.length<6)return d.slice(0,2)+"-"+d.slice(2);if(d.length<10)return d.slice(0,2)+"-"+d.slice(2,5)+"-"+d.slice(5);return d.slice(0,2)+"-"+d.slice(2,6)+"-"+d.slice(6,10);}
  if(d.length<4)return d;if(d.length<8)return d.slice(0,3)+"-"+d.slice(3);if(d.length<11)return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);}
$("#phone").addEventListener("input",e=>{e.target.value=fmt(e.target.value);});
const pre=new URLSearchParams(location.search).get("region");
if(pre&&[...$("#region").options].some(o=>o.value===pre))$("#region").value=pre;
const rules=[["name",v=>v.trim()!==""],["phone",v=>/^0\d{1,2}-\d{3,4}-\d{4}$/.test(v)],["email",v=>!v||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())],["region",v=>v!==""],["space",v=>v!==""]];
rules.forEach(([id])=>{const el=$("#"+id);el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{el.classList.remove("bad");$("#e-"+id).hidden=true;});});
$("#agree").addEventListener("change",()=>$("#e-agree").hidden=true);
$("#form").addEventListener("submit",e=>{
  e.preventDefault();let first=null;
  rules.forEach(([id,ok])=>{const el=$("#"+id);if(!ok(el.value)){el.classList.add("bad");$("#e-"+id).hidden=false;first=first||el;}});
  if(!$("#agree").checked){$("#e-agree").hidden=false;first=first||$("#agree");}
  if(first){first.focus();first.scrollIntoView({block:"center",behavior:"smooth"});return;}
  $("#form").hidden=true;$("#done").hidden=false;$("#done").scrollIntoView({block:"center",behavior:"smooth"});
});
})();
</script>
</body>
</html>
