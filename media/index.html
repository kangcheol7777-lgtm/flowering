<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미디어 콘텐츠 | 꽃피는디자인스튜디오</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../curtain/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root{--ivory:#F7F1E6;--sand:#E2D4BF;--bark:#3A2A1F;--umber:#7A6250;--walnut:#6E4327;--caramel:#B98A5E;--on-walnut:#FFF8EE;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--bark);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--caramel);font-weight:600}
h1{font-family:"Gowun Batang","Nanum Myeongjo",serif;font-size:clamp(28px,6vw,40px);color:var(--walnut);margin:12px 0 0}
p{color:var(--umber);margin:12px 0 0}
a{display:inline-block;margin-top:28px;background:var(--walnut);color:var(--on-walnut);text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px}
a:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}
</style>
</head>
<body>
<div>
  <div class="eyebrow">Media Contents</div>
  <h1>미디어 콘텐츠</h1>
  <p>지금 준비하고 있습니다. 곧 공개할게요.</p>
  <a href="../">← 꽃피는디자인스튜디오로</a>
</div>
</body>
</html>
