<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시공 지역 | 꽃피는 커튼 블라인드</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.note{background:var(--paper);border:1px solid var(--sand);border-left:4px solid var(--caramel);border-radius:12px;padding:16px 20px;color:var(--umber);margin-bottom:40px}
.region+.region{margin-top:48px}
.region h2{font-size:24px;margin-bottom:16px;display:flex;align-items:baseline;gap:10px}
.region h2 small{font-family:var(--f-body);font-size:14px;color:var(--umber);font-weight:400}
.area{display:grid;gap:6px;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--sand);border-radius:14px;padding:18px;transition:border-color .2s}
.area:hover{border-color:var(--walnut)}
.area h3{font-size:19px}
.area p{color:var(--umber);font-size:14px}
.area .go{font-size:14px;font-weight:600;color:var(--walnut)}
.area.ask{background:transparent;border-style:dashed}
</style>
</head>
<body>
<div id="site-header"></div>

<div class="phero">
  <div class="wrap">
    <span class="eyebrow">Service area</span>
    <h1>시공 지역</h1>
    <p>서울 · 경기 · 인천 지역에 무료로 방문해 실측과 견적을 도와드립니다.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <p class="note">목록에 없는 동네도 방문할 수 있는 경우가 많습니다. <b class="tnum">070-8098-8555</b>로 전화 주시거나 온라인 견적 신청에 주소를 남겨주세요.</p>
    <div id="regions"></div>
  </div>
</section>

<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="site.js"></script>
<script>
(function(){
  var R=[
    ["서울",[["강남구","도곡 · 역삼 · 대치 · 청담"],["서초구","반포 · 잠원 · 서초 · 방배"],["송파구","잠실 · 문정 · 가락 · 방이"],["강동구","고덕 · 명일 · 천호 · 둔촌"],["구로구","신도림 · 개봉 · 고척 · 오류"],["금천구","가산 · 독산 · 시흥"]],"그 외 서울"],
    ["경기",[["광명","철산 · 하안 · 소하"],["부천","중동 · 상동 · 송내 · 역곡"],["안양","평촌 · 범계 · 비산 · 호계"],["시흥","배곧 · 정왕 · 은행 · 대야"]],"그 외 경기"],
    ["인천",[["부평구","부평 · 부개 · 삼산 · 산곡"],["계양구","작전 · 계산 · 귤현 · 효성"],["남동구","구월 · 논현 · 서창 · 간석"],["서구","청라 · 검단 · 가정 · 석남"]],"그 외 인천"]
  ];
  var box=document.getElementById("regions");
  R.forEach(function(r){
    var d=document.createElement("div");d.className="region";
    d.innerHTML='<h2>'+r[0]+' <small>'+r[1].length+'곳 방문 가능</small></h2><div class="grid g4">'
      + r[1].map(function(a){return '<a class="area" href="inquiry.html"><h3>'+a[0]+'</h3><p>'+a[1]+'</p><span class="go">견적 신청 →</span></a>';}).join("")
      + '<a class="area ask" href="tel:07080988555"><h3>'+r[2]+'</h3><p>방문 가능 여부를 전화로 확인해 드립니다.</p><span class="go tnum">📞 070-8098-8555</span></a>'
      + '</div>';
    box.appendChild(d);
  });
})();
</script>
</body>
</html>
