<style>
.summary{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;margin-bottom:28px;color:var(--umber)}
.summary b{font-family:var(--f-display);font-size:34px;color:var(--bark)}
.summary .rv-stars{font-size:20px}
</style>

<body>
<div id="site-header"></div>

<div class="phero">
  <div class="wrap">
    <span class="eyebrow">Reviews</span>
    <h1>고객 후기</h1>
    <p>꽃피는 커튼 블라인드와 함께한 고객님들의 이야기입니다.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="summary" id="summary" hidden></div>
    <div id="reviews"></div>
  </div>
</section>

<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="site.js?v=20261028b"></script>
<script src="reviews.js?v=20261028b"></script>
<script>
(function(){
  var R=window.REVIEWS||[];
  window.renderReviews(document.getElementById("reviews"));
  if(R.length){
    var avg=R.reduce(function(s,r){return s+(+r.rating||0);},0)/R.length, n=Math.round(avg);
    var s=document.getElementById("summary");
    s.innerHTML='<b class="tnum">'+avg.toFixed(1)+'</b><div><div class="rv-stars">'+"★".repeat(n)+'<span>'+"★".repeat(5-n)+'</span></div><div class="tnum">후기 '+R.length+'개</div></div>';
    var src=(window.REVIEW_SOURCES||[]).map(function(x){return '<a href="'+x.url+'" target="_blank" rel="noopener" style="color:var(--walnut)">'+x.name+' 평점 '+x.rating+' · 후기 '+x.count+'건</a>';}).join(" · ");
    if(src)s.innerHTML+='<div style="flex-basis:100%;text-align:center;font-size:13px">'+src+' <span style="opacity:.75">(별점만 남긴 후기 포함)</span></div>';
    s.hidden=false;
  }
})();
</script>
</body>
