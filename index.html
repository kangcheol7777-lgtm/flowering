<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꽃피는디자인스튜디오</title>
<meta name="description" content="꽃피는디자인스튜디오 — 커튼·블라인드, 미디어 콘텐츠.">
<link rel="icon" href="curtain/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="curtain/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="꽃피는디자인스튜디오">
<meta property="og:title" content="꽃피는디자인스튜디오">
<meta property="og:description" content="커튼·블라인드, 미디어 콘텐츠.">
<meta property="og:image" content="https://floweringds.kr/curtain/og-image.png">
<meta property="og:url" content="https://floweringds.kr/"><link rel="canonical" href="https://floweringds.kr/">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#6E4327">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 커튼 주름 띠 → 가운데 스튜디오 이름 → 큰 버튼 두 개 → 짧은 푸터 */
:root{
  --ivory:#F7F1E6; --paper:#FFFCF6; --linen:#EFE5D5; --sand:#E2D4BF;
  --bark:#3A2A1F; --umber:#7A6250; --walnut:#6E4327; --walnut-dark:#55331D; --caramel:#B98A5E; --on-walnut:#FFF8EE;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--bark);font-family:var(--f-body);line-height:1.6;word-break:keep-all;display:flex;flex-direction:column;min-height:100%}
:focus-visible{outline:3px solid var(--caramel);outline-offset:3px}
.pleat{height:22px;background:repeating-linear-gradient(90deg,#EADFCB 0 22px,#D7C6AA 22px 34px,#E5D8C0 34px 48px);border-bottom:6px solid var(--walnut)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding-block:56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:760px;text-align:center}
.eyebrow{display:block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--caramel);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,8vw,60px);line-height:1.2;margin:14px 0 0;color:var(--walnut);text-wrap:balance}
.lead{color:var(--umber);margin:14px auto 0;max-width:30em;font-size:16px}
.choices{display:grid;gap:16px;margin-top:44px;grid-template-columns:1fr}
@media (min-width:600px){.choices{grid-template-columns:1fr 1fr}}
.choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;text-decoration:none;color:inherit;background:var(--paper);border:1.5px solid var(--sand);border-radius:20px;padding:26px 24px 24px;min-height:150px;transition:border-color .2s,transform .2s,box-shadow .2s}
.choice:hover{border-color:var(--walnut);transform:translateY(-3px);box-shadow:0 18px 36px -22px rgba(58,42,31,.55)}
.choice .t{font-family:var(--f-display);font-weight:700;font-size:24px}
.choice .d{color:var(--umber);font-size:15px}
.choice .go{margin-top:auto;padding-top:14px;font-weight:700;color:var(--walnut);font-size:15px}
.choice.main{background:var(--walnut);border-color:var(--walnut);color:var(--on-walnut)}
.choice.main .d{color:#E9D9C6}
.choice.main .go{color:var(--on-walnut)}
.choice.main:hover{background:var(--walnut-dark)}
.badge{position:absolute;top:18px;right:18px;font-size:12px;font-weight:600;color:var(--umber);background:var(--linen);padding:3px 10px;border-radius:999px}
footer{text-align:center;font-size:13px;color:var(--umber);padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-top:1px solid var(--sand)}
footer b{color:var(--bark);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.choice{transition:none}}
</style>
</head>
<body>
<div class="pleat" aria-hidden="true"></div>
<main>
  <div class="wrap">
    <span class="eyebrow">Flowering Design Studio</span>
    <h1>꽃피는디자인스튜디오</h1>
    <nav class="choices" aria-label="사업 분야">
      <a class="choice main" href="curtain/">
        <span class="t">커튼·블라인드</span>
        <span class="d">맞춤 커튼과 블라인드 제작·시공, 무료 방문 견적</span>
        <span class="go">사이트 바로가기 →</span>
      </a>
      <a class="choice" href="media/">
        <span class="badge">준비 중</span>
        <span class="t">미디어 콘텐츠</span>
        <span class="d">새로운 콘텐츠를 준비하고 있습니다</span>
        <span class="go">살펴보기 →</span>
      </a>
    </nav>
  </div>
</main>
<footer>문의 <b>070-8098-8555</b> · © 2026 꽃피는디자인스튜디오</footer>
</body>
</html>
