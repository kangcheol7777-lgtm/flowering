<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지역 안내 | 꽃피는 커튼 블라인드</title>
<!-- seo -->
<meta name="description" content="지역별 커튼·블라인드 무료 방문 실측과 견적 안내.">
<meta name="keywords" content="커튼, 블라인드, 린넨 커튼, 암막 커튼, 우드 블라인드, 롤스크린, 콤비 블라인드, 허니콤, 맞춤 커튼, 커튼 설치, 서울 커튼, 경기 커튼, 인천 커튼, 꽃피는 커튼 블라인드">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="꽃피는 커튼 블라인드">
<meta property="og:title" content="지역 안내 | 꽃피는 커튼 블라인드">
<meta property="og:description" content="지역별 커튼·블라인드 무료 방문 실측과 견적 안내.">
<meta property="og:image" content="https://kangcheol7777-lgtm.github.io/flowering/og-image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#6E4327">
<!-- /seo -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.crumb{font-size:14px;color:var(--umber);margin-bottom:10px}
.crumb a{text-decoration:none}
.dongs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.dongs a{text-decoration:none}
.dongs span{background:var(--paper);border:1px solid var(--sand);border-radius:999px;padding:5px 14px;font-size:14px}
.lead{font-size:17px;color:var(--umber)}
.lead+.lead{margin-top:12px}
.pending{text-align:center;background:var(--paper);border:1.5px dashed var(--sand);border-radius:16px;padding:32px 20px;color:var(--umber)}
.near{display:flex;flex-wrap:wrap;gap:8px}
.near a{border:1.5px solid var(--sand);background:var(--paper);border-radius:999px;padding:8px 16px;text-decoration:none}
.near a:hover{border-color:var(--walnut)}
.nf{text-align:center;padding-block:80px}
</style>
</head>
<body>
<div id="site-header"></div>

<main id="page"></main>

<div id="site-cta"></div>
<div id="site-footer"></div>
<script src="site.js"></script>
<script src="areas-data.js"></script>
<script>
(function(){
  var key=new URLSearchParams(location.search).get("a")||"";
  var hit=window.findArea(key), page=document.getElementById("page");
  if(!hit){
    page.innerHTML='<section class="nf wrap"><h1>지역을 찾을 수 없습니다</h1><p style="color:var(--umber);margin-top:10px">시공 지역 목록에서 다시 골라주세요.</p><a class="btn pri" style="margin-top:20px" href="areas.html">시공 지역 보기</a></section>';
    return;
  }
  var a=hit.area, full=hit.full, anchor={"서울":"seoul","인천":"incheon","경기":"gyeonggi"}[hit.group];
  var label=hit.city ? hit.city.name+" "+a.name : a.name;          // 화면에 쓸 짧은 이름
  var groupAreas=window.AREAS.filter(function(x){return x.group===hit.group;})[0].areas;
  document.title=full+" 커튼·블라인드 | 꽃피는 커튼 블라인드";
  var md=document.querySelector('meta[name="description"]');
  if(md) md.content=full+" 커튼·블라인드 맞춤 제작과 무료 방문 실측. 꽃피는 커튼 블라인드 070-8098-8555";

  var crumb='<a href="areas.html">시공 지역</a> › <a href="areas.html#'+anchor+'">'+hit.group+'</a>'
    +(hit.city?' › <a href="area.html?a='+hit.city.key+'">'+hit.city.name+'</a>':'');
  var dongs=a.dongs?'<div class="dongs">'+a.dongs.split("·").map(function(d){return '<span>'+d.trim()+'</span>';}).join("")+'</div>':'';
  var guBlock='';
  if(a.gu){ // 구가 있는 시의 페이지
    dongs='<div class="dongs">'+a.gu.map(function(u){return '<a href="area.html?a='+u.key+'"><span>'+u.name+'</span></a>';}).join("")+'</div>';
    guBlock='<div class="sec-head" style="margin-top:40px"><h2 style="font-size:22px">'+a.name+' 구별 안내</h2></div><div class="near">'
      +a.gu.map(function(u){return '<a href="area.html?a='+u.key+'">'+a.name+' '+u.name+' →</a>';}).join("")+'</div>';
  }
  var inq="inquiry.html?region="+encodeURIComponent(full);

  var nearTitle, near;
  if(hit.city){
    nearTitle=hit.city.name+'의 다른 구';
    near=hit.city.gu.filter(function(u){return u.key!==a.key;}).map(function(u){return '<a href="area.html?a='+u.key+'">'+u.name+'</a>';}).join("")
      +'<a href="area.html?a='+hit.city.key+'">'+hit.city.name+' 전체</a>';
  } else {
    nearTitle=(hit.group==="경기"?"경기도의 다른 시":hit.group+"의 다른 구");
    near=groupAreas.filter(function(x){return x.key!==a.key;}).map(function(x){return '<a href="area.html?a='+x.key+'">'+x.name+'</a>';}).join("");
  }

  page.innerHTML=
    '<div class="phero"><div class="wrap">'
    +'<p class="crumb">'+crumb+'</p>'
    +'<h1>'+full+' 커튼·블라인드</h1>'
    +'<p>'+label+' 어디든 직접 찾아가 창을 재고, 집에 맞는 제품을 함께 고릅니다.</p>'
    +dongs
    +'<div class="btns" style="justify-content:center;margin-top:24px"><a class="btn pri" href="'+inq+'">'+label+' 무료 견적 신청</a><a class="btn line tnum" href="tel:07080988555">📞 070-8098-8555</a></div>'
    +'</div></div>'
    +'<section><div class="wrap narrow">'
    +'<div class="sec-head"><span class="eyebrow">Visit</span><h2>'+label+' 방문 상담 안내</h2></div>'
    +'<p class="lead">'+(a.note||(label+'의 아파트, 빌라, 주택, 사무실과 매장까지 방문합니다. 창의 방향과 앞 건물과의 거리, 생활 시간대를 보고 알맞은 원단과 설치 방식을 권해 드립니다.'))+'</p>'
    +'<p class="lead">실측과 샘플 상담은 무료이고, 견적을 확인하신 뒤에 결정하시면 됩니다. 실측 후 5~7일이면 설치까지 끝나고, 시공 후 1년 동안 무상 A/S를 해드립니다.</p>'
    +guBlock
    +'</div></section>'
    +'<section class="band"><div class="wrap">'
    +'<div class="sec-head center"><span class="eyebrow">Process</span><h2>진행 과정</h2></div>'
    +'<ol class="steps"><li><span class="num">01</span><h3>견적 신청</h3><p>전화나 온라인으로 문의해 주세요.</p></li><li><span class="num">02</span><h3>방문 실측</h3><p>'+label+' 댁으로 찾아가 창을 잽니다.</p></li><li><span class="num">03</span><h3>맞춤 제작</h3><p>실측 치수대로 제작합니다.</p></li><li><span class="num">04</span><h3>시공 완료</h3><p>설치와 사용법 안내까지 마칩니다.</p></li></ol>'
    +'</div></section>'
    +'<section><div class="wrap narrow">'
    +'<div class="sec-head"><span class="eyebrow">Works</span><h2>'+label+' 시공 사례</h2></div>'
    +'<div class="pending"><p>'+label+' 시공 사례를 준비하고 있습니다.</p><a class="more" href="gallery.html">다른 지역 사례 보기 →</a></div>'
    +'<div class="sec-head" style="margin:48px 0 16px"><h2 style="font-size:22px">'+nearTitle+'</h2></div>'
    +'<div class="near">'+near+'<a href="areas.html">전체 지역 →</a></div>'
    +'</div></section>';
})();
</script>
</body>
</html>
