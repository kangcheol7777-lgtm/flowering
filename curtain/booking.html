<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무료 방문 상담 예약 | 꽃피는 커튼 블라인드</title>
<meta name="description" content="1분이면 무료 방문 상담 예약까지. 서울·경기·인천 아파트 커튼·블라인드 무료 실측, 맞춤 제작, 직접 시공.">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="꽃피는 커튼 블라인드">
<meta property="og:title" content="무료 방문 상담 예약 | 꽃피는 커튼 블라인드">
<meta property="og:description" content="1분이면 무료 방문 상담 예약까지. 서울·경기·인천 무료 실측·맞춤 제작·직접 시공.">
<meta property="og:image" content="https://floweringds.kr/curtain/og-image.png">
<meta property="og:url" content="https://floweringds.kr/curtain/booking.html">
<link rel="canonical" href="https://floweringds.kr/curtain/booking.html">
<meta name="theme-color" content="#BACEE0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* ── 채팅형 예약 랜딩 ──
   첫 화면 = 채팅 상담(대화 + 하단 입력창) → 아래로 집구경 · 진행 과정 · 후기 · FAQ · 사업자 정보 */
body{padding-bottom:0;background:var(--ivory)}
.app{height:100svh;min-height:560px;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:linear-gradient(180deg,var(--paper),var(--ivory) 40%)}
@media (min-width:760px){.app{border-left:1px solid var(--sand);border-right:1px solid var(--sand)}}

.hd{flex:none;text-align:center;padding:18px 16px 12px;border-bottom:1px solid var(--sand);background:rgba(255,252,246,.9)}
.hd .logo{height:34px;width:auto;display:block;margin:0 auto 6px}
.hd .tt{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.hd .tg{color:var(--umber);font-size:14px;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--bark);background:var(--linen);padding:4px 12px;border-radius:999px}
.live i{width:7px;height:7px;border-radius:50%;background:#3E9B5C;box-shadow:0 0 0 0 rgba(62,155,92,.5);animation:pulse 2s infinite}
.live b{font-variant-numeric:tabular-nums}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(62,155,92,0)}100%{box-shadow:0 0 0 0 rgba(62,155,92,0)}}

.log{flex:1;overflow-y:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--umber);margin-top:4px}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--walnut);color:var(--on-walnut);display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--f-display)}
.b{max-width:86%;padding:11px 14px;border-radius:4px 16px 16px 16px;background:var(--paper);border:1px solid var(--sand);font-size:15px;line-height:1.55;animation:pop .25s ease-out}
.b strong{display:block;font-size:16px}
.b small{display:block;color:var(--umber);font-size:13px;margin-top:3px}
.b.me{align-self:flex-end;background:var(--walnut);color:var(--on-walnut);border-color:var(--walnut);border-radius:16px 4px 16px 16px}
.chg{align-self:flex-end;background:none;border:0;color:var(--umber);font-size:12px;cursor:pointer;padding:0 4px;margin-top:-6px;text-decoration:underline}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--caramel);animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.cp{flex:none;border-top:1px solid var(--sand);background:var(--paper);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));max-height:62svh;overflow-y:auto}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--umber);margin-bottom:10px}
.prog b{color:var(--walnut);font-weight:600}
.prog .bar{flex:1;height:4px;border-radius:4px;background:var(--linen);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--walnut);transition:width .4s}
.cp input[type=text],.cp input[type=tel],.cp input[type=date],.cp textarea{width:100%;min-height:50px;border:1px solid var(--sand);border-radius:12px;padding:0 14px;background:#fff;font-size:16px}
.cp textarea{min-height:72px;padding:12px 14px;resize:vertical}
.cp input:focus,.cp textarea:focus{outline:none;border-color:var(--walnut)}
.cp .bad{border-color:var(--danger)!important}
.stack{display:grid;gap:8px}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.go{width:100%;min-height:52px;border-radius:12px;border:0;background:var(--walnut);color:var(--on-walnut);font-weight:700;font-size:16px;cursor:pointer}
.go:hover{background:var(--walnut-dark)}
.go:disabled{opacity:.45;cursor:default}
.sub{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--sand);background:transparent;color:var(--umber);font-size:14px;cursor:pointer}
.hint{font-size:12px;color:var(--umber);text-align:center}
.err{font-size:13px;color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--sand);background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:var(--bark)}
.chip small{font-weight:400;color:var(--umber);margin-left:4px}
.chip:hover{border-color:var(--caramel)}
.chip[aria-pressed=true]{background:var(--walnut);border-color:var(--walnut);color:var(--on-walnut)}
.chip[aria-pressed=true] small{color:var(--linen)}
.chips.full .chip{flex:1 1 calc(50% - 4px)}
.agree{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--bark);cursor:pointer}
.agree input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--walnut);flex:none}
.agree a{color:var(--umber)}
.perk{display:inline-block;background:#F6E7D3;color:var(--walnut);font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px;margin-left:4px}
.tiers{display:grid;gap:8px}
.tier{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--sand);background:#fff;cursor:pointer;color:var(--bark)}
.tier:hover{border-color:var(--caramel)}
.tier b{font-size:15px}.tier span{font-size:13px;color:var(--umber);grid-column:1}
.tier em{grid-row:1/3;grid-column:2;font-style:normal;font-weight:700;color:var(--walnut);font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:56px;padding:8px 0;border-radius:12px;border:1.5px solid var(--sand);background:#fff;text-align:center;cursor:pointer;color:var(--bark);line-height:1.25}
.day small{display:block;font-size:11px;color:var(--umber)}
.day b{font-size:17px;font-variant-numeric:tabular-nums}
.day.sun small,.day.sun b{color:var(--danger)}
.day[aria-pressed=true]{background:var(--walnut);border-color:var(--walnut)}
.day[aria-pressed=true] small,.day[aria-pressed=true] b{color:var(--on-walnut)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{min-height:42px;border-radius:10px;border:1.5px solid var(--sand);background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--bark)}
.slot:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.slot[aria-pressed=true]{background:var(--walnut);border-color:var(--walnut);color:var(--on-walnut)}
.fast{font-size:13px;color:var(--walnut);font-weight:600}
.sum{background:#fff;border:1px solid var(--sand);border-radius:14px;padding:4px 14px;font-size:14px}
.sum div{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:9px 0;border-bottom:1px dashed var(--sand)}
.sum div:last-child{border-bottom:0}
.sum dt{color:var(--umber)}.sum dd{margin:0;font-weight:600}
.okmark{width:52px;height:52px;border-radius:50%;background:var(--linen);color:var(--walnut);display:grid;place-items:center;font-size:26px;margin:4px auto 8px}

/* 아래 콘텐츠 */
.more-sec{max-width:720px;margin:0 auto;padding:56px 18px}
.more-sec h2{font-size:clamp(22px,4.5vw,28px);margin-bottom:6px}
.more-sec .lead{color:var(--umber);margin-bottom:20px}
.rooms{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -18px;padding-left:18px;padding-right:18px}
.room{flex:none;width:78%;max-width:300px;scroll-snap-align:start;background:var(--paper);border:1px solid var(--sand);border-radius:16px;overflow:hidden}
.room img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.room .tx{padding:14px}
.room .k{font-size:12px;color:var(--caramel);font-weight:700;letter-spacing:.08em}
.room h3{font-size:18px;margin:2px 0 6px}
.room p{font-size:14px;color:var(--umber)}
.room .pd{margin-top:8px;font-size:13px;font-weight:600;color:var(--walnut)}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.flow li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--paper);border:1px solid var(--sand);border-radius:14px;padding:14px}
.flow .n{width:40px;height:40px;border-radius:50%;background:var(--walnut);color:var(--on-walnut);display:grid;place-items:center;font-weight:700}
.flow b{display:block}.flow span{color:var(--umber);font-size:14px}
.faq2 details{background:var(--paper);border:1px solid var(--sand);border-radius:12px;padding:0 16px;margin-bottom:8px}
.faq2 summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none}
.faq2 summary::after{content:"+";float:right;color:var(--caramel)}
.faq2 details[open] summary::after{content:"–"}
.faq2 p{padding-bottom:14px;color:var(--umber);font-size:15px}
.back{display:flex;justify-content:center;margin-top:28px}
.ft{border-top:1px solid var(--sand);padding:22px 18px 28px;text-align:center;font-size:12px;color:var(--umber);line-height:1.8}
.ft a{color:var(--umber)}
/* ── 카카오톡 기본 배색 ── */
:root{--k-bg:#BACEE0;--k-yel:#FEE500;--k-yel-h:#F5DC00;--k-ink:#191919;--k-sub:#556677;--k-line:#E5E5E5;--k-soft:#F5F6F8}
body{background:#fff;color:var(--k-ink)}
.app{background:var(--k-bg);border:0!important}
.hd{background:var(--k-bg);border-bottom:1px solid rgba(0,0,0,.06)}
.hd .tg{color:var(--k-sub)}
.live{background:rgba(255,255,255,.65);color:var(--k-ink)}
.who{color:#3D4A57}
.who .av{border-radius:12px;background:#9FB8CE;color:#fff}
.b{background:#fff;border:0;border-radius:4px 14px 14px 14px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.b small{color:#6B7684}
.b.me{background:var(--k-yel);color:var(--k-ink);border-radius:14px 4px 14px 14px}
.chg{color:var(--k-sub)}
.typing span{background:#9AA7B4}
.cp{background:#fff;border-top:1px solid var(--k-line)}
.prog{color:#8B95A1}.prog b{color:var(--k-ink)}
.prog .bar{background:#EDEDED}.prog .bar i{background:var(--k-yel)}
.cp input[type=text],.cp input[type=tel],.cp input[type=date],.cp textarea{border-color:var(--k-line);background:var(--k-soft)}
.cp input:focus,.cp textarea:focus{border-color:var(--k-ink);background:#fff}
.go{background:var(--k-yel);color:var(--k-ink)}
.go:hover{background:var(--k-yel-h)}
.sub{border-color:var(--k-line);color:#6B7684}
.hint{color:#8B95A1}
.chip,.tier,.day,.slot{border-color:var(--k-line);color:var(--k-ink)}
.chip small,.tier span,.day small{color:#8B95A1}
.chip:hover,.tier:hover{border-color:var(--k-yel-h)}
.chip[aria-pressed=true],.day[aria-pressed=true],.slot[aria-pressed=true]{background:var(--k-yel);border-color:var(--k-yel);color:var(--k-ink)}
.chip[aria-pressed=true] small,.day[aria-pressed=true] small,.day[aria-pressed=true] b{color:var(--k-ink)}
.tier em,.fast{color:var(--k-ink)}
.agree{color:var(--k-ink)}.agree input{accent-color:var(--k-yel)}.agree a{color:#6B7684}
.perk{background:var(--k-yel);color:var(--k-ink)}
.sum{border-color:var(--k-line)}.sum div{border-bottom-color:#EFEFEF}.sum dt{color:#8B95A1}
.okmark{background:var(--k-yel);color:var(--k-ink)}
.cp .btn.line{color:var(--k-ink);border-color:var(--k-line)}
.more-sec .lead,.room p,.flow span,.faq2 p{color:#6B7684}
.eyebrow{color:#8B95A1}
.band{background:var(--k-soft)}
.room,.flow li,.faq2 details,.rv{background:#fff;border-color:var(--k-line)}
.room .k,.faq2 summary::after{color:#8B95A1}
.room .pd{color:var(--k-ink)}
.flow .n{background:var(--k-yel);color:var(--k-ink)}
.rv-stars{color:#F5B400}.rv-stars span{color:#E5E5E5}.rv-text,.rv-who{color:#6B7684}.rv-who{border-top-color:#EFEFEF}
.btn.pri{background:var(--k-yel);color:var(--k-ink)}.btn.pri:hover{background:var(--k-yel-h)}
.ft{border-top-color:var(--k-line);color:#8B95A1}.ft a{color:#8B95A1}
.gowrap{position:relative;margin-top:14px}
.tip{position:absolute;right:14px;top:-15px;z-index:1;background:var(--k-ink);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.tip::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--k-ink)}
@keyframes bob{50%{transform:translateY(-3px)}}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.sheet.on{background:rgba(0,0,0,.45)}
.sheet .panel{position:relative;width:100%;max-width:720px;background:#fff;border-radius:20px 20px 0 0;padding:26px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease-out}
.sheet.on .panel{transform:none}
.sheet .x{position:absolute;right:10px;top:8px;width:40px;height:40px;border:0;background:none;font-size:26px;color:#8B95A1;cursor:pointer}
.sheet .st{font-weight:700;font-size:17px;margin-bottom:22px}
.sheet .gowrap{margin-top:0}
.sheet .go{min-height:56px;font-size:17px}
.sheet .ci{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 2px;border-top:1px solid #EFEFEF;font-size:14px}
.sheet .ci b{color:#E5483B;font-weight:600}
.sheet .more{background:none;border:0;color:#8B95A1;text-decoration:underline;cursor:pointer;font-size:13px}
.sheet .terms{background:var(--k-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:#6B7684;line-height:1.7}
/* 둘러보기 버튼 (입력창 위) */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.cat{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;border-radius:14px;border:1px solid var(--k-line);background:var(--k-soft);font-size:12.5px;letter-spacing:-.02em;white-space:nowrap;font-weight:600;color:var(--k-ink);cursor:pointer}
.cat .ic{font-size:19px;line-height:1.1}
.cat .bd{position:absolute;top:-7px;right:8px;background:#E5483B;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;font-style:normal}
.cat:hover{border-color:var(--k-yel-h)}
/* 채팅 안 콘텐츠 카드 */
.card{width:100%;max-width:100%;background:#fff;border-radius:14px;padding:6px 14px;font-size:14px;animation:pop .25s ease-out}
.card ol{list-style:none;margin:0;padding:0}
.card li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #EFEFEF}
.card li:last-child{border-bottom:0}
.card .n{width:28px;height:28px;border-radius:50%;background:var(--k-yel);display:grid;place-items:center;font-weight:700;font-size:13px}
.card li b{display:block}.card li span{color:#6B7684;font-size:13px}
.qlist{display:grid;gap:6px;padding:8px 0}
.qbtn{text-align:left;padding:11px 12px;border-radius:10px;border:1px solid var(--k-line);background:var(--k-soft);font-size:14px;cursor:pointer;color:var(--k-ink)}
.qbtn.ask{background:#fff;border-style:dashed;color:#6B7684}
.rvs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.rvs::-webkit-scrollbar{display:none}
.rvc{flex:none;width:240px;background:var(--k-soft);border-radius:12px;padding:12px;font-size:13px}
.rvc .st{color:#F5B400;letter-spacing:1px}.rvc b{display:block;margin:2px 0 4px;font-size:14px}.rvc p{color:#6B7684;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.rvc small{display:block;margin-top:6px;color:#8B95A1}
.replies{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.reply{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--k-line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--k-ink)}
.tourcard{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:14px;padding:14px;cursor:pointer;color:var(--k-ink);font:inherit}
.tourcard em{font-style:normal;font-size:11px;letter-spacing:.12em;color:#8B95A1;font-weight:700}
.tourcard em.bd{letter-spacing:0;background:#E5483B;color:#fff;padding:1px 6px;border-radius:999px;margin-left:6px;font-size:10px}
.tourcard strong{display:block;font-size:16px;margin-top:4px}.tourcard .d{display:block;color:#6B7684;font-size:13px}
.tourcard .th{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0}.tourcard .th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.tourcard .go2{font-weight:700;font-size:14px}
.biz{font-size:11px;color:#8B95A1;text-align:center;line-height:1.7;margin-top:4px}.biz a{color:#8B95A1}
.askrow{display:grid;grid-template-columns:1fr auto;gap:8px}
/* 집구경 전체화면 */
.tour{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tour .in{max-width:720px;margin:0 auto;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.tour .x{position:sticky;top:0;float:right;z-index:2;width:48px;height:48px;border:0;background:rgba(255,255,255,.9);border-radius:0 0 0 14px;font-size:28px;color:#555;cursor:pointer}
.tour .hero{padding:40px 18px 14px}
.tour .hero em{font-style:normal;font-size:11px;letter-spacing:.16em;color:#8B95A1;font-weight:700}
.tour .hero h2{font-family:var(--f-body);font-size:24px;margin-top:6px}
.tour .hero p{color:#6B7684;font-size:14px;margin-top:4px}
.tour .tabs{position:sticky;top:0;z-index:1;display:flex;gap:6px;overflow-x:auto;padding:10px 60px 10px 18px;background:#fff;border-bottom:1px solid #EFEFEF;scrollbar-width:none}
.tour .tabs::-webkit-scrollbar{display:none}
.tour .tabs button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--k-line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;color:var(--k-ink)}
.tour .tabs button[aria-pressed=true]{background:var(--k-yel);border-color:var(--k-yel)}
.tour section{padding:22px 18px 6px;scroll-margin-top:60px}
.tour section .k{font-size:11px;letter-spacing:.14em;color:#8B95A1;font-weight:700}
.tour section h3{font-family:var(--f-body);font-size:20px;margin:2px 0 4px}

<script>
(function(){
/* ═══════════════════════════════════════════════
   ▶ 설정 — 이 부분만 고치면 됩니다
   ═══════════════════════════════════════════════ */
var CFG = {
  FORM_TO: "kkangcheol777@naver.com",   // 예약 접수 메일 받을 주소 (FormSubmit)
  DISCOUNT: 5,                          // 웹 예약 할인(%) — 웹으로 예약한 모든 고객에게 적용. 할인을 안 하면 0
  LIVE_MIN: 30, LIVE_MAX: 100,          // '최근 1시간 동안 N명' 숫자 범위
  FB_PIXEL_ID: "",                      // 메타 픽셀 ID — 넣으면 PageView / Lead(번호 입력) / Schedule(예약 완료) 전송
  DAYS_AHEAD: 14,                       // 방문 날짜를 오늘부터 며칠까지 보여줄지

  TIERS: [
    { name:"실속형",   desc:"쉬폰·암막 커튼 + 콤비 블라인드" },

    { name:"프리미엄", desc:"고급 원단 · 이중 커튼 · 허니콤" },

    "40평대 이상": ["79~109만 원","109~159만 원","159~209만 원","209만 원 이상"]

};
/* ═══════════════════════════════════════════════ */

var SITE = window.SITE || {name:"꽃피는 커튼 블라인드",tel:"070-8098-8555",telHref:"tel:07080988555"};
var $ = function(s,r){return (r||document).querySelector(s);};
var KEY = "fl_booking_v1";
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function el(tag,attrs,html){var e=document.createElement(tag);for(var k in attrs||{}){if(k==="on")for(var ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}

/* ── 실시간 상담 숫자: 방문자마다 1시간 동안 같은 숫자, 1시간이 지나면 새로 뽑음 ── */
(function(){
  var now=Date.now(), s=store("fl_live");
  if(!s||now-s.t>3600e3||s.n<CFG.LIVE_MIN||s.n>CFG.LIVE_MAX){
    s={n:CFG.LIVE_MIN+Math.floor(Math.random()*(CFG.LIVE_MAX-CFG.LIVE_MIN+1)),t:now};store("fl_live",s);
  }
  $("#liveN").textContent=s.n;
})();

/* ── 메타 픽셀 ── */
function px(ev,data){if(window.fbq)window.fbq("track",ev,data||{});}
if(CFG.FB_PIXEL_ID){
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  fbq("init",CFG.FB_PIXEL_ID);fbq("track","PageView");
}

/* ── 날짜 도우미 ── */
var WD=["일","월","화","수","목","금","토"];
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function parseYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function korDate(s){var d=parseYmd(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+WD[d.getDay()]+")";}
function daysUntil(s){return Math.round((parseYmd(s)-today0())/864e5);}
function slotOpen(day,slot){
  var d=parseYmd(day),h=slot.split(":");d.setHours(+h[0],+h[1]);
  return d.getTime()>=Date.now()+CFG.LEAD_HOURS*3600e3;
}
function earliest(){
  for(var i=0;i<=CFG.DAYS_AHEAD;i++){var d=today0();d.setDate(d.getDate()+i);var k=ymd(d);
    for(var j=0;j<CFG.SLOTS.length;j++)if(slotOpen(k,CFG.SLOTS[j]))return {day:k,slot:CFG.SLOTS[j],i:i};}
  return null;
}
function fmtPhone(v){var d=v.replace(/\D/g,"").slice(0,11);
  if(d.length<4)return d;if(d.length<8)return d.slice(0,3)+"-"+d.slice(3);
  if(d.length<11)return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);}

/* ── 상태 ── */
var S = store(KEY) || {};
var A = S.a || {};          // 답변
var cur = S.cur || 0;       // 현재 단계 번호(STEPS 기준)
var resumed = !!(S.a && S.a.name && !S.done);
function save(){store(KEY,{a:A,cur:cur,done:!!A.doneAt});}

/* ── 단계 정의 ── */
var STEPS = [
  { id:"contact", label:"연락처",
    q:function(){return ["<strong>성함과 번호만 알려주세요</strong><small>확인 안 하고 넘기면, 우리 집 예상 견적을 모르고 지나가요.</small>"];},
    me:function(){return esc(A.name)+" · "+esc(A.phone);},
    ack:function(){return esc(A.name)+" 님, 반가워요! 몇 가지만 더 여쭤볼게요.";},
    ui:uiContact },
  { id:"movein", label:"입주일",
    q:function(){return ["<strong>입주 예정일이 언제세요?</strong><small>대략적인 날짜도 괜찮아요.</small>"];},
    me:function(){return A.movein.length===10?korDate(A.movein):A.movein;},
    ack:function(){
      if(A.movein.length===10){var n=daysUntil(A.movein);
        if(n<=14)return korDate(A.movein)+" 입주시군요. 얼마 안 남으셨네요! 가장 빠른 방문 일정으로 잡아드릴게요.";
        return korDate(A.movein)+" 입주시군요. 입주일에 맞춰 시공 일정을 잡아드릴게요.";}
      return null;},
    ui:function(done){
      var box=el("div",{class:"stack"}),pick=el("div",{class:"row2",hidden:""});
      var inp=el("input",{type:"date","aria-label":"입주 예정일"});inp.min=ymd(today0());
      var ok=el("button",{class:"go",style:"width:auto;padding:0 20px",on:{click:function(){if(!inp.value){inp.classList.add("bad");return;}done({movein:inp.value});}}},"확인");
      pick.append(inp,ok);
      box.append(chips([["입주 예정일 고르기",function(){pick.hidden=false;inp.focus();try{inp.showPicker();}catch(e){}}],["이미 입주했어요",function(){done({movein:"이미 입주했어요"});}],["아직 미정",function(){done({movein:"아직 미정"});}]],"full"),pick);
      return box;} },
  { id:"scope", label:"시공 범위",
    q:function(){return ["<strong>전체 시공인가요, 부분 시공인가요?</strong>"];},
    me:function(){return A.scope;},
    ui:function(done){return chips([["전체 시공",function(){done({scope:"전체 시공"});},"집 전체 창"],["부분 시공",function(){done({scope:"부분 시공"});},"일부 공간만"]],"full");} },
  { id:"size", label:"평형", when:function(){return A.scope==="전체 시공";},
    q:function(){return ["<strong>몇 평대 집이세요?</strong>"];},
    me:function(){return A.size;},
    ui:function(done){return chips([["20평대",function(){done({size:"20평대"});},"59㎡"],["30평대",function(){done({size:"30평대"});},"84㎡"],["40평대 이상",function(){done({size:"40평대 이상"});}],["상가·사무실",function(){done({size:"상가·사무실"});}]],"full");} },
  { id:"spaces", label:"공간 선택", when:function(){return A.scope==="부분 시공";},
    q:function(){return ["<strong>어느 공간을 바꾸실까요?</strong><small>여러 곳을 골라도 돼요.</small>"];},
    me:function(){return A.spaces.join(", ");},
    ack:function(){return "부분 시공은 창 크기에 따라 금액이 달라져서, 방문 실측 후 정확히 안내드려요.";},
    ui:function(done){
      var sel=(A.spaces||[]).slice(),box=el("div",{class:"stack"});
      var go=el("button",{class:"go",on:{click:function(){done({spaces:sel});}}},"다음 →");
      var c=el("div",{class:"chips"});
      ["거실","안방","작은방1","작은방2","아이방","주방","서재","드레스룸","베란다","기타"].forEach(function(n){
        var b=el("button",{class:"chip","aria-pressed":sel.indexOf(n)>-1?"true":"false",on:{click:function(){
          var i=sel.indexOf(n);if(i>-1)sel.splice(i,1);else sel.push(n);
          b.setAttribute("aria-pressed",i>-1?"false":"true");go.disabled=!sel.length;}}},n);c.append(b);});
      go.disabled=!sel.length;box.append(c,go);return box;} },
  { id:"budget", label:"예산", when:function(){return A.scope==="전체 시공";},
    q:function(){
      var base=CFG.PRICES[A.size]?A.size+" 전체 시공 기준이에요.":"공간에 따라 금액이 달라져요.";
      return ["<strong>생각해 두신 예산이 있으세요?</strong><small>"+base+"</small>"];},
    me:function(){return A.budget;},
    ack:function(){return A.budget.indexOf("방문")>-1?"좋아요. 방문 때 예산에 맞는 원단을 함께 골라드릴게요.":"정확한 금액은 방문 실측 후 확정해 드려요. 꽃피는 커튼 블라인드가 직접 제작·시공해서 가능한 가격이에요.";},
    ui:function(done){
      var p=CFG.PRICES[A.size],box=el("div",{class:"tiers"});
      CFG.TIERS.forEach(function(t,i){
        var label=t.name+(p?" · "+p[i]:"");
        box.append(el("button",{class:"tier",on:{click:function(){done({budget:label});}}},"<b>"+t.name+"</b><span>"+t.desc+"</span>"+(p?"<em>"+p[i]+"</em>":"")));});
      box.append(el("button",{class:"sub",on:{click:function(){done({budget:"방문 때 상담할게요"});}}},"잘 모르겠어요 · 방문 때 상담할게요"));
      return box;} },
  { id:"visit", label:"방문 일시",
    q:function(){return ["<strong>방문 상담 날짜를 골라주세요.</strong><small>디자이너가 샘플을 들고 찾아가요. 상담은 무료예요.</small>"];},
    me:function(){return A.visitDay?korDate(A.visitDay)+" "+A.visitTime:A.visitTime;},
    ui:uiVisit },
  { id:"addr", label:"주소",
    q:function(){return ["<strong>방문할 주소를 알려주세요.</strong><small>아파트명과 동·호수까지 적어주시면 정확히 찾아가요.</small>"];},
    me:function(){return esc(A.addr)+(A.addr2?" "+esc(A.addr2):"");},
    ui:uiAddr },
  { id:"confirm", label:"확인", nocount:true,
    q:function(){return ["<strong>이대로 예약할까요?</strong><small>바꾸고 싶은 답은 위 대화에서 ‘이 답 바꾸기’를 눌러주세요.</small>"];},
    ui:uiConfirm }
];
function active(){return STEPS.filter(function(s){return !s.when||s.when();});}

/* ── 공통 UI ── */
function chips(list,cls){
  var c=el("div",{class:"chips "+(cls||"")});
  list.forEach(function(x){c.append(el("button",{class:"chip",on:{click:x[1]}},esc(x[0])+(x[2]?"<small>"+esc(x[2])+"</small>":"")));});
  return c;
}
var log=$("#log"),cp=$("#cp");
function who(){log.append(el("div",{class:"who"},'<span class="av">꽃</span>꽃피는 디자이너'));}
/* 상담 말풍선: 마침표·느낌표 뒤에는 무조건 줄바꿈 (태그 안은 건드리지 않음) */
function brk(html){return String(html).replace(/([.!])[ \u00a0]+(?![^<]*>)/g,"$1<br>");}
function bot(html){log.append(el("div",{class:"b"},brk(html)));}
/* 진행 중에 둘러보기(집구경·시공과정·FAQ)로 나눈 대화 — 해당 단계 질문 뒤에 그대로 다시 그려줌 */
var side=[];
function sideNode(it){
  if(it.k==="me")return el("div",{class:"b me"},esc(it.t));
  if(it.k==="bot")return el("div",{class:"b"},brk(it.h));
  return el("div",{class:it.cls||"card"},it.h);
}
function drawSide(id){side.forEach(function(it){if(it.step===id)log.append(sideNode(it));});}
function addSide(items){
  var id=A.doneAt?"done":STEPS[cur].id;
  items.forEach(function(it){it.step=id;side.push(it);log.append(sideNode(it));});
  scrollEnd();
}
function scrollEnd(){requestAnimationFrame(function(){log.scrollTop=log.scrollHeight;});}

/* ── 그리기 ── */
var typingTimer;
function render(animate){
  clearTimeout(typingTimer);
  var steps=active(),idx=steps.indexOf(STEPS[cur]);if(idx<0){cur=STEPS.indexOf(steps[0]);idx=0;}
  log.innerHTML="";
  who();bot("안녕하세요, 꽃피는 커튼 블라인드 디자이너예요. 몇 가지만 고르시면 <b>무료 방문 상담</b>을 잡아드릴게요. 1분이면 끝나요.");
  for(var i=0;i<idx;i++){
    var s=steps[i];s.q().forEach(bot);drawSide(s.id);
    if(s.me){log.append(el("div",{class:"b me"},s.me()));
      (function(si){log.append(el("button",{class:"chg",on:{click:function(){if(A.doneAt)return;cur=STEPS.indexOf(si);save();render();}}},"이 답 바꾸기"));})(s);}
    var ack=s.ack&&s.ack();if(ack)bot(ack);
  }
  if(resumed&&animate!=="fresh"&&animate!==true&&idx>0){bot("다시 오셨네요, "+esc(A.name)+" 님. 이어서 진행할게요.");}
  var st=steps[idx];
  if(A.doneAt){renderDone();drawSide("done");scrollEnd();return;}
  var total=A.scope==="부분 시공"?6:7,n=idx+1;
  cp.innerHTML=(idx>0?catsHtml():"")+'<div class="prog"><b>'+st.label+'</b><span class="bar"><i style="width:'+Math.round((st.nocount?1:idx/total)*100)+'%"></i></span><span class="tnum">'+(st.nocount?"마지막":n+" / "+total)+'</span></div>';
  var showQ=function(){st.q().forEach(bot);drawSide(st.id);
    if(askMode){cp.append(uiAsk());scrollEnd();return;}
    var ui=st.ui(function(patch){answer(st,patch);});if(ui)cp.append(ui);scrollEnd();
    var f=cp.querySelector("input:not([type=checkbox])");if(f&&animate&&window.innerWidth>700)f.focus();};
  if(animate===true){var t=el("div",{class:"b typing"},"<span></span><span></span><span></span>");log.append(t);scrollEnd();
    typingTimer=setTimeout(function(){t.remove();showQ();},550);}
  else showQ();
}
function answer(st,patch){
  for(var k in patch)A[k]=patch[k];
  var steps=active(),i=steps.indexOf(st);
  cur=STEPS.indexOf(steps[Math.min(i+1,steps.length-1)]);
  save();render(true);
}

/* ── 1. 연락처 ── */
function uiContact(done){
  /* 모프스튜디오와 같은 방식: 입력창엔 성함·번호만 → 번호 11자리가 채워지면 동의 시트가 자동으로 올라옴 */

function uiVisit(done){

  var day=A.visitDay&&daysUntil(A.visitDay)>=0?A.visitDay:(e?e.day:ymd(today0())),slot=A.visitTime&&A.visitDay===day?A.visitTime:null;
  if(e)box.append(el("div",{class:"fast"},"⚡ 가장 빠른 방문: "+(e.i===0?"오늘":e.i===1?"내일":korDate(e.day))+" "+e.slot));

  var go=el("button",{class:"go",on:{click:function(){done({visitDay:day,visitTime:slot});}}});
  function drawSlots(){
    slots.innerHTML="";
    CFG.SLOTS.forEach(function(s){var open=slotOpen(day,s);
      var b=el("button",{class:"slot","aria-pressed":s===slot?"true":"false"},s);b.disabled=!open;
      b.addEventListener("click",function(){slot=s;drawSlots();});slots.append(b);});
    go.disabled=!slot;go.textContent=slot?korDate(day)+" "+slot+"로 할게요":"시간을 골라주세요";

      var any=CFG.SLOTS.some(function(s){return slotOpen(k,s);});if(!any)return;
      var b=el("button",{class:"day"+(d.getDay()===0?" sun":""),"aria-pressed":k===day?"true":"false"},"<small>"+(i===0?"오늘":i===1?"내일":WD[d.getDay()])+"</small><b>"+d.getDate()+"</b>");
      b.addEventListener("click",function(){day=k;slot=null;days.querySelectorAll(".day").forEach(function(x){x.setAttribute("aria-pressed","false");});b.setAttribute("aria-pressed","true");drawSlots();});
      days.append(b);})(i);

}
function closeTour(fromPop){
  if(tourEl.hidden)return;tourEl.hidden=true;document.body.style.overflow="";
  if(!fromPop){try{if(history.state&&history.state.tour)history.back();}catch(e){}}
}
window.addEventListener("popstate",function(){closeTour(true);});
tourEl.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("x"))return closeTour();
  if(t.dataset.k){$("#tr-"+t.dataset.k,tourEl).scrollIntoView({behavior:"smooth"});tourEl.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-pressed",String(b===t));});return;}
  if(t.dataset.room){closeTour();
    if(!A.doneAt){A.memo=(A.memo?A.memo+" / ":"")+t.dataset.room+" 스타일 관심";save();
      addSide([{k:"me",t:t.dataset.room+" 스타일이 마음에 들어요"},{k:"bot",h:"좋아요! 방문 상담 때 우리 집 창에 맞춰 "+esc(t.dataset.room)+" 스타일을 제안드릴게요. 이어서 진행해 주세요."}]);
      var f=cp.querySelector("input,button.chip,button.tier,button.day,button.go");if(f&&f.tagName==="INPUT")f.focus();}
  }
});

/* 시공과정 + 후기 */
function processCard(){
  var steps=[["상담 신청","대화창에서 몇 가지 고르고 번호만 남기면 끝나요."],["방문 실측","약속한 날 찾아가 창마다 정확히 재고, 샘플을 창에 대보며 골라요."],["현장 견적","그 자리에서 견적을 드려요. 견적을 보고 천천히 결정하셔도 돼요."],["제작·시공","실측 후 5~7일이면 제작과 설치까지 끝나요. 시공 후 1년 무상 A/S."]];
  return '<ol>'+steps.map(function(x,i){return '<li><span class="n">'+(i+1)+'</span><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div></li>';}).join("")+'</ol>';
}
function maskName(n){n=String(n||"").trim();if(n.length<=1)return n||"고객";if(n.length===2)return n[0]+"*";return n[0]+"*".repeat(n.length-2)+n[n.length-1];}
function reviewsCard(){
  var list=(window.REVIEWS||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));}).slice(0,6);
  if(!list.length)return null;
  return '<div class="rvs">'+list.map(function(r){var n=Math.max(0,Math.min(5,Math.round(+r.rating||0)));
    return '<div class="rvc"><span class="st">'+"★".repeat(n)+'</span><b>'+esc(r.title)+'</b><p>'+esc(r.text)+'</p><small>'+esc(maskName(r.name))+' · '+esc(r.region||"")+(r.product?' · '+esc(r.product):'')+'</small></div>';}).join("")+'</div>';
}
function resumeItems(){
  if(A.doneAt)return [];
  return [{k:"html",cls:"replies",h:'<button class="reply" data-act="resume">이어서 상담하기</button>'}];
}

/* 자주 묻는 질문 — kw: 직접 질문했을 때 이 단어가 들어 있으면 이 답을 보여줌 */
var FAQ=[
  {q:"실측 비용이 있나요?",a:"없어요. 방문 실측과 견적 상담은 무료예요. 제품을 결정하신 후에만 비용이 생겨요.",kw:["실측비","비용","방문비","출장비","무료","유료","돈"]},
  {q:"실측 받으면 꼭 계약해야 하나요?",a:"아니요. 견적을 보고 천천히 결정하셔도 됩니다.",kw:["계약","부담","안해도","거절","강요"]},
  {q:"입주 전에도 실측이 되나요?",a:"네. 입주 전 방문이 가능하면 미리 실측해서 입주일에 맞춰 시공해 드려요.",kw:["입주","이사","신축","빈집"]},
  {q:"원단을 직접 보고 고를 수 있나요?",a:"방문 상담 때 원단 샘플을 가져가 우리 집 빛 아래에서 직접 대보고 고르실 수 있어요.",kw:["원단","샘플","색상","컬러","색깔"]},
  {q:"어떤 제품이 있나요?",a:"린넨·쉬폰·암막 커튼과 콤비·우드·알루미늄·허니콤 블라인드, 롤스크린이 있어요. 공간에 맞게 추천해 드려요.",kw:["제품","종류","커튼","블라인드","콤비","롤스크린","허니콤","우드"]},
  {q:"제작·시공은 얼마나 걸리나요?",a:"실측 후 5~7일이면 제작과 설치까지 끝나요. 정확한 설치 날짜는 실측하는 날 안내해 드려요.",kw:["기간","며칠","걸리","걸려","언제","소요","빨리"]},
  {q:"어느 지역까지 방문하나요?",a:"서울·경기·인천 지역은 신청하신 당일에도 방문할 수 있어요. 상담 시간은 오전 8시부터 오후 8시까지예요.",kw:["지역","서울","경기","인천","어디","방문 가능"]},
  {q:"전세·월세 집에도 설치할 수 있나요?",a:"가능해요. 벽 손상을 줄이는 설치 방식도 있으니 상담 때 말씀해 주세요.",kw:["전세","월세","벽","구멍","타공"]},
  {q:"설치 후 문제가 생기면요?",a:"시공 후 1년 동안 무상으로 A/S 해드려요.",kw:["as","a/s","고장","수리","하자","보증"]}
];
var PRICE_KW=["가격","얼마","견적","비싸","저렴","금액","만원"];
function faqCard(){
  return '<div class="qlist">'+FAQ.map(function(f,i){return '<button class="qbtn" data-faq="'+i+'">'+f.q+'</button>';}).join("")
    +(A.doneAt||askCount>=2?'':'<button class="qbtn ask" data-act="ask">✏️ 다른 질문 남기기</button>')+'</div>';
}
var askMode=false,askCount=0;
function uiAsk(){
  var box=el("div",{class:"stack"});
  var inp=el("input",{type:"text",placeholder:"궁금한 점을 짧게 남겨주세요",maxlength:"300","aria-label":"질문"});
  var go=el("button",{class:"go",style:"width:auto;padding:0 18px"},"보내기");
  var row=el("div",{class:"askrow"});row.append(inp,go);
  function submit(){var q=inp.value.trim();if(!q)return;askCount++;askMode=false;
    A.questions=(A.questions||[]).concat([q]);save();
    var low=q.toLowerCase(),hit=null;
    FAQ.forEach(function(f){if(!hit&&f.kw.some(function(k){return low.indexOf(k)>-1;}))hit=f.a;});
    if(!hit&&PRICE_KW.some(function(k){return low.indexOf(k)>-1;}))hit="정확한 금액은 창 크기에 따라 달라져서, 방문 실측 후 바로 확정해 드려요.";
    if(A.leadSent)sendQuestion(q);
    addSide([{k:"me",t:q},{k:"bot",h:(hit?esc(hit)+"<br><br>":"")+(hit?"더 궁금하신 건 방문 상담 때 자세히 알려드릴게요.":"이 부분은 담당 디자이너가 정확히 알려드릴게요. 남겨주신 질문은 상담 때 꼭 답변드릴게요.")}].concat(resumeItems()));
    redrawComposer();}
  go.addEventListener("click",submit);inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit();}});
  box.append(row,el("button",{class:"sub",on:{click:function(){askMode=false;redrawComposer();}}},"취소"));
  setTimeout(function(){inp.focus();},30);
  return box;
}
function sendQuestion(q){
  send({"_subject":"[고객 질문] "+A.name+" / "+A.phone,"_template":"table","_captcha":"false","성함":A.name,"연락처":A.phone,"질문":q,"접수 시각":stamp()}).catch(function(){});
}
/* 입력창만 다시 그리기(대화는 그대로) */
function redrawComposer(){
  if(A.doneAt)return;
  var steps=active(),idx=steps.indexOf(STEPS[cur]),st=steps[idx];
  var total=A.scope==="부분 시공"?6:7;
  cp.innerHTML=(idx>0?catsHtml():"")+'<div class="prog"><b>'+st.label+'</b><span class="bar"><i style="width:'+Math.round((st.nocount?1:idx/total)*100)+'%"></i></span><span class="tnum">'+(st.nocount?"마지막":(idx+1)+" / "+total)+'</span></div>';
  cp.append(askMode?uiAsk():st.ui(function(patch){answer(st,patch);}));
}

/* 버튼 클릭 처리 (대화창 + 입력창) */
function onAct(e){
  var t=e.target.closest("[data-act],[data-faq]");if(!t)return;
  var act=t.dataset.act;
  if(t.dataset.faq!=null){var f=FAQ[+t.dataset.faq];addSide([{k:"me",t:f.q},{k:"bot",h:esc(f.a)}].concat(resumeItems()));return;}
  if(act==="tour")return openTour();
  if(act==="process"){var items=[{k:"me",t:"시공과정"},{k:"bot",h:"이렇게 진행돼요. 첫 단계인 방문 상담은 무료예요."},{k:"html",h:processCard()}];
    addSide(items.concat(resumeItems()));return;}
  if(act==="reviews"){var rv=reviewsCard();
    addSide([{k:"me",t:"고객 후기"}].concat(rv?[{k:"bot",h:"고객님들이 남겨주신 후기예요. 시공을 마친 고객님이 게시에 동의해 주신 실제 후기예요."},{k:"html",cls:"card",h:rv}]:[{k:"bot",h:"시공을 마친 고객님들의 후기가 곧 이곳에 채워져요."}]).concat(resumeItems()));return;}
  if(act==="faq"){addSide([{k:"me",t:"자주 묻는 질문"},{k:"bot",h:"자주 물어보시는 것들이에요."},{k:"html",h:faqCard()}]);return;}
  if(act==="ask"){if(askCount>=2){addSide([{k:"bot",h:"더 궁금하신 건 방문 상담 때 자세히 알려드릴게요."}]);return;}
    addSide([{k:"me",t:"다른 질문 남기기"},{k:"bot",h:"궁금한 점을 짧게 남겨주세요."}]);askMode=true;redrawComposer();return;}
  if(act==="resume"){var st=STEPS[cur];addSide([{k:"bot",h:st.q()[0]}]);return;}
}
log.addEventListener("click",onAct);cp.addEventListener("click",onAct);

render(false);
})();
</script>
</body>
</html>
